<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-sscale=1.0" />
    <title>Vibeboard</title>
    <meta name="theme-color" content="#0f0c14" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100%22><text y=%22.9em%22 font-size=%2290%22>🖤</text></svg>"
    />

    <!-- Fonts we'll use for the pairings -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bebas+Neue&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Dancing+Script:wght@600&family=EB+Garamond&family=Inter:wght@400;600&family=Josefin+Sans:wght@400;600&family=Lora&family=Montserrat:wght@400;600&family=Playfair+Display:wght@500;700&family=Quicksand:wght@500;700&family=Space+Mono&family=Special+Elite&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Vibeboard</h1>
        <p class="subtitle">Pick a vibe. Get your aesthetic.</p>
      </header>

      <!-- Vibe buttons get added here by Js -->
      <section id="vibes" class="vibes"></section>

      <!-- The mood board -->
      <section id="board" class="board">
        <div id="board-title" class="board-title">Your Vibe</div>
        <div id="board-tagline" class="board-tagline">
          Choose a vibe above to begin.
        </div>

        <div id="palette" class="palette"></div>

        <div class="board-row">
          <div class="card">
            <div class="label">Fonts</div>
            <div id="font-heading" class="font-heading">
              Heading + body pairing
            </div>
          </div>
          <div class="card">
            <div class="label">Mood words</div>
            <div id="words" class="words"></div>
          </div>
        </div>

        <blockquote id="quote" class="quote"></blockquote>
      </section>

      <section class="actions">
        <button id="btn-shuffle">🔀 Shuffle</button>
        <button id="btn-save">📸 Save as image</button>
      </section>

      <details class="custom" id="custom">
        <summary>Create your own vibe</summary>

        <div claass="custom-body">
          <label
            >Vibe name
            <input
              type="text"
              id="custom-name"
              placeholder="e.g. Velvet Midnight"
              maxlength="30"
            />
          </label>

          <div class="label">Your 5 colors</div>
          <div class="color-inputs">
            <label
              >Background <input type="color" id="c0" value="1b1424"
            /></label>
            <label>Panel <input type="color" id="c1" value="#3a2850" /></label>
            <label>Accent <input type="color" id="c2" value="#b88cff" /></label>
            <label>Extra <input type="color" id="c3" value="#6b4a9e" /></label>
            <label>Text <input type="color" id="c4" value="#f1e8ff" /></label>
          </div>
          <button id="btn-random-colors" class="small-btn">
            🎲 Random colors
          </button>

          <label
            >Fonts
            <select id="custom-font"></select>
          </label>
          <label
            >Mood words (separate with commas)
            <input
              type="text"
              id="custom-words"
              placeholder="dreamy, dark, soft, wild, golden"
            />
          </label>

          <label
            >Quote
            <textarea
              id="custom-quote"
              rows="2"
              maxlength="120"
              placeholder="Write something that fits your vibe..."
            ></textarea>
          </label>

          <button id="btn-create" class="small-btn primary">
            Create my board
          </button>
        </div>
      </details>

      <p id="toast" class="toast"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
